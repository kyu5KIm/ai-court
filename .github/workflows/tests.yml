name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and server tests (a stand-in replaces the claude CLI)
        run: python -m unittest discover -s tests
      # Node is only used here, as a syntax check of the joined page. Users never need it.
      - name: Page script syntax
        shell: bash
        run: |
          python -c "import sys, os; sys.path.insert(0, 'skills/court'); import court; open('page.js', 'w', encoding='utf-8').write(court.bundle_js(os.path.join(court.WEB, 'js', 'main.js')))"
          node --check page.js
