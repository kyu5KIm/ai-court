<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 법정</title>
<style>
:root{
  --bg:#f4eee3; --panel:#fffdf8; --panel-2:#f8f2e7; --ink:#2a2118; --muted:#74685a; --line:#e2d6c1;
  --wall:#efe3cf; --wall-2:#e6d6bb; --floor:#d9c3a0; --floor-2:#cfb791; --jury:#c9ae85;
  --wood:#7a4e2b; --wood-hi:#98683e; --wood-dk:#5c3a1f; --gold:#b8892b;
  --pros:#b3261e; --pros-bg:#fbe9e6; --def:#1f5fa8; --def-bg:#e6eefa; --ng:#2e7d4f;
  --shadow:0 1px 2px rgba(60,40,20,.07),0 8px 24px rgba(60,40,20,.07);
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang","AppleMyungjo",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16120e; --panel:#211b15; --panel-2:#1b1611; --ink:#efe6d8; --muted:#a89a86; --line:#3a3027;
    --wall:#2a2119; --wall-2:#241c15; --floor:#3a2c20; --floor-2:#33271c; --jury:#2e231a;
    --wood:#6e4626; --wood-hi:#8a5c35; --wood-dk:#4a2f19; --gold:#d6a84a;
    --pros:#ec8379; --pros-bg:#3a1f1c; --def:#8db6ee; --def-bg:#1a2a3d; --ng:#7fcf9c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16120e; --panel:#211b15; --panel-2:#1b1611; --ink:#efe6d8; --muted:#a89a86; --line:#3a3027;
  --wall:#2a2119; --wall-2:#241c15; --floor:#3a2c20; --floor-2:#33271c; --jury:#2e231a;
  --wood:#6e4626; --wood-hi:#8a5c35; --wood-dk:#4a2f19; --gold:#d6a84a;
  --pros:#ec8379; --pros-bg:#3a1f1c; --def:#8db6ee; --def-bg:#1a2a3d; --ng:#7fcf9c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px;overflow-x:clip}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.kicker{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.top h1{font-family:var(--serif);font-size:clamp(19px,2.6vw,27px);margin:2px 0 0;line-height:1.35;max-width:46ch}
.phases{display:flex;gap:6px;flex-wrap:wrap;padding:0;margin:0;list-style:none}
.phases li{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel);transition:background .3s,color .3s}
.phases li.done{color:var(--ink)}
.phases li.on{background:var(--wood);border-color:var(--wood);color:#fff}

.layout{display:grid;grid-template-columns:480px minmax(0,1fr);gap:22px;align-items:start}

/* ---------- stage ---------- */
.stage{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.scene{--h:380px;--s:46px;--walk:1100ms;position:relative;height:var(--h);overflow:hidden;
  background:linear-gradient(var(--wall) 0 40%,var(--floor) 40% 100%)}
.scene.shake{animation:shake .4s ease-in-out 2}
.scene::before{content:"";position:absolute;left:0;right:0;top:40%;bottom:0;
  background:repeating-linear-gradient(90deg,transparent 0 58px,var(--floor-2) 58px 60px)}
.wall-trim{position:absolute;left:0;right:0;top:calc(40% - 6px);height:6px;background:var(--wood)}
.emblem{position:absolute;left:50%;top:3%;width:15%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  border:3px solid var(--gold);display:grid;place-items:center;font-size:calc(var(--s)*.5);color:var(--gold);background:var(--wall-2);opacity:.9}
.curtain{position:absolute;top:0;height:40%;width:9%;background:repeating-linear-gradient(90deg,#8a2a22 0 8px,#7a221c 8px 16px);opacity:.85}
.curtain.l{left:0} .curtain.r{right:0}
.furn{position:absolute;transform:translateX(-50%);border-radius:4px 4px 0 0;
  background:linear-gradient(var(--wood-hi),var(--wood));box-shadow:inset 0 -4px 0 var(--wood-dk);display:flex;justify-content:center;align-items:flex-start}
.plate{margin-top:4px;font-size:10px;line-height:1.5;padding:0 6px;border-radius:3px;background:var(--gold);color:#2a1d0c;font-weight:700;white-space:nowrap}
.bench{left:50%;top:27%;width:44%;height:14%;z-index:11}
.clerk-desk{left:25%;top:35%;width:13%;height:7%;z-index:15}
.table{top:56%;width:24%;height:9%;z-index:31}
.table.pros{left:15%} .table.def{left:85%}
.table.pros .plate{background:var(--pros);color:#fff} .table.def .plate{background:var(--def);color:#fff}
.lectern{left:50%;top:58%;width:10%;height:10%;z-index:33;border-radius:6px 6px 0 0}
.jurybox{position:absolute;left:3%;right:3%;bottom:0;border-radius:10px 10px 0 0;background:var(--jury);opacity:.75}
.rail{position:absolute;left:3%;right:3%;bottom:0;height:5%;background:linear-gradient(var(--wood-hi),var(--wood));z-index:45;border-radius:3px 3px 0 0}
.rail span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;color:#fff;opacity:.8;letter-spacing:.1em;white-space:nowrap}

/* characters */
.chr{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:var(--s);height:var(--s);
  transform:translate(-50%,-100%);transition:left var(--walk) linear,top var(--walk) linear}
.chr.judge{--s:calc(var(--h)*.135)}
.spr{width:100%;height:100%;display:block;overflow:visible}
.spr .eyes{transform-box:view-box;transform-origin:8px 6px;animation:blinkeye 4.2s infinite}
.chr.walking .spr{animation:bob .3s ease-in-out infinite}
.chr.walking .la{animation:legs .3s steps(1) infinite}
.chr.walking .lb{animation:legs .3s steps(1) infinite .15s}
.chr.talking .torso{animation:talk .42s ease-in-out infinite}
.chr.hop .spr{animation:hop .65s ease-out}
.chr.cheer .spr{animation:hop .65s ease-out 4}
.chr.slump .spr{transform:translateY(10%) scaleY(.82);transition:transform .5s}
.chr.active::after{content:"";position:absolute;left:10%;right:10%;bottom:-6%;height:12%;border-radius:50%;background:radial-gradient(rgba(255,214,120,.65),transparent 70%);z-index:-1}
.sign{position:absolute;left:50%;bottom:100%;transform:translate(-50%,0) scale(0);transform-origin:50% 100%;
  display:flex;flex-direction:column;align-items:center;transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.sign b{display:block;white-space:nowrap;font-size:calc(var(--s)*.3);line-height:1;padding:3px 5px;border-radius:3px;background:#fff;border:2px solid var(--muted);color:var(--muted)}
.sign i{display:block;width:2px;height:calc(var(--s)*.18);background:var(--wood-dk)}
.sign.g b{border-color:#b3261e;color:#b3261e} .sign.n b{border-color:#2e7d4f;color:#2e7d4f}
.sign.on{transform:translate(-50%,-2px) scale(1)}
.think{position:absolute;left:62%;bottom:88%;font-size:calc(var(--s)*.28);line-height:1;padding:2px 5px;border-radius:8px;background:#fff;color:#555;
  opacity:0;transition:opacity .3s;pointer-events:none}
.chr.thinking .think{opacity:1;animation:thinkfloat 1.6s ease-in-out infinite}
.gavel{position:absolute;left:62%;top:27%;width:calc(var(--s)*.95);height:calc(var(--s)*.95);transform:translate(-50%,-92%);z-index:12}
.gavel .arm{transform-box:view-box;transform-origin:52px 22px;transform:rotate(12deg)}
.gavel .arm rect{fill:#f3e3c7} .gavel .arm rect:first-child{fill:#c99a62}
.gavel .block{fill:var(--wood-dk)}
.gavel.strike .arm{animation:strike 1.1s ease-in both}

.bubble{position:absolute;z-index:55;max-width:min(72%,300px);padding:7px 10px;border-radius:10px;background:#fffdf7;color:#2a2118;
  font-size:12.5px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.18);border:1.5px solid #2a2118;
  opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.bubble-tail{position:absolute;z-index:56;width:12px;height:12px;background:#fffdf7;border:1.5px solid #2a2118;border-top:0;border-left:0;
  transform:rotate(45deg);opacity:0;transition:opacity .2s;pointer-events:none}
.bubble-tail.on{opacity:1}
.bubble-tail.up{transform:rotate(225deg)}
.bubble.pros,.bubble-tail.pros{border-color:#b3261e}
.bubble.def,.bubble-tail.def{border-color:#1f5fa8}

.score{position:absolute;left:10px;top:10px;z-index:50;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:rgba(255,253,248,.92);border:1px solid var(--line);font-size:11px;color:#74685a}
.score b{font-family:var(--serif);font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.score .g{color:#b3261e} .score .n{color:#2e7d4f}
.score b.bump{animation:bump .5s ease-out}
.stamp{position:absolute;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%) rotate(-8deg) scale(1.6);opacity:0;pointer-events:none;
  text-align:center;white-space:nowrap;padding:8px 22px;border:5px solid currentColor;border-radius:10px;color:#b3261e;background:rgba(255,253,248,.9);
  transition:transform .45s cubic-bezier(.2,.9,.3,1.3),opacity .3s,left .6s,top .6s}
.stamp.n{color:#2e7d4f} .stamp.h{color:#74685a}
.stamp b{display:block;font-family:var(--serif);font-size:calc(var(--h)*.13);line-height:1.1;letter-spacing:.1em}
.stamp span{font-size:13px;font-weight:700}
.stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
.stamp.parked{left:84%;top:14%;transform:translate(-50%,-50%) rotate(-8deg) scale(.42)}

.now{display:flex;align-items:center;gap:8px;min-height:40px;padding:9px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.now b{color:var(--ink);font-weight:600}
.controls{display:flex;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line)}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--wood-hi)}
button.primary{background:var(--wood);border-color:var(--wood);color:#fff;flex:1}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* new case */
.newcase{font-size:13px;padding:6px 14px;border-radius:999px;background:var(--wood);border-color:var(--wood);color:#fff}
dialog#newcase{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;
  width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#newcase::backdrop{background:rgba(20,14,8,.55)}
#nc-form{padding:20px 20px 16px;display:flex;flex-direction:column;gap:10px}
#nc-form h2{font-family:var(--serif);margin:0;font-size:20px}
.nc-hint{margin:0;font-size:13px;color:var(--muted)}
.nc-tips{margin:0;padding-left:1.2em;font-size:13px;color:var(--muted);columns:2;column-gap:24px}
#nc-case{font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  background:var(--panel-2);color:var(--ink);resize:vertical;min-height:150px}
.nc-row{display:flex;gap:10px;flex-wrap:wrap}
.nc-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1 1 160px}
.nc-row select,.nc-row input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel-2);color:var(--ink)}
#nc-case:focus,.nc-row select:focus,.nc-row input:focus{outline:2px solid var(--gold);outline-offset:1px}
.nc-err{margin:0;font-size:12px;color:var(--pros)}
.nc-err:empty{display:none}
.nc-actions{display:flex;gap:8px;justify-content:flex-end}
.nc-actions .primary{flex:0 0 auto}
@media (max-width:520px){ .nc-tips{columns:1} }

/* live + questions */
.status{position:absolute;left:10px;top:44px;z-index:50;display:none;align-items:center;gap:6px;max-width:62%;padding:3px 10px;border-radius:999px;
  background:rgba(255,253,248,.92);border:1px solid var(--line);font-size:11px;color:#5a4f42}
.status.on{display:flex}
.status i{width:7px;height:7px;border-radius:50%;background:#d33;flex:none;animation:blink 1.2s infinite}
.status.off i{background:#999;animation:none}
.chr.waiting .think{opacity:1;animation:thinkfloat 1.6s ease-in-out infinite}
.ask{display:none;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.ask.on{display:flex}
.ask select,.ask input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:7px 8px;min-width:0}
.ask select{flex:0 1 auto;max-width:44%}
.ask input{flex:1 1 140px}
.ask input:focus,.ask select:focus{outline:2px solid var(--gold);outline-offset:1px}
.ask button{flex:0 0 auto}
.ask-note{font-size:11px;color:var(--muted);padding:0 14px 10px;margin:0}
.ask-note:empty{display:none}
.kicker .live{margin-left:8px;color:#d33;font-weight:700;letter-spacing:.08em}
.kicker .live.done{color:var(--muted)}
.msg.user{align-self:flex-end;max-width:min(520px,84%);background:var(--def-bg);border-color:transparent;border-top-right-radius:4px}
.msg.user header{flex-direction:row-reverse}
.msg.answer{border-top:3px solid var(--gold)}
.msg.answer.err .body{color:var(--muted)}
.past{align-self:stretch;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 14px}
.past summary{cursor:pointer;font-size:13px;color:var(--muted)}
.past[open] summary{margin-bottom:10px}
.past .qa{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}

/* ---------- transcript ---------- */
.log{display:flex;flex-direction:column;gap:14px;min-width:0}
.intro{align-self:stretch;text-align:center;padding:30px 20px;border:1px dashed var(--line);border-radius:16px;background:var(--panel)}
.intro .cast{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:6px}
.intro .cast svg{width:44px;height:44px}
.intro .cast svg.big{width:56px;height:56px}
.intro h2{font-family:var(--serif);font-size:15px;color:var(--muted);font-weight:600;margin:10px 0 4px;letter-spacing:.1em}
.intro .case{font-family:var(--serif);font-size:clamp(17px,2.2vw,21px);margin:0 auto 6px;max-width:40ch}
.intro .meta{font-size:12px;color:var(--muted);margin:0 0 18px}
.intro button{font-size:15px;padding:10px 22px}
.intro .hint{font-size:12px;color:var(--muted);margin:14px 0 0}
.intro.started button,.intro.started .hint{display:none}
.msg{max-width:min(640px,88%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px 14px;box-shadow:var(--shadow);animation:pop .35s ease-out both;scroll-margin:24px}
.msg.left{align-self:flex-start;border-left:4px solid var(--pros);border-top-left-radius:4px}
.msg.right{align-self:flex-end;border-right:4px solid var(--def);border-top-right-radius:4px}
.msg.center{align-self:center;max-width:min(660px,96%);background:var(--panel-2)}
.msg header{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;flex-wrap:wrap}
.msg.right header{flex-direction:row-reverse}
.msg header .av{width:26px;height:26px;flex:none;display:block}
.msg header .av svg{width:100%;height:100%;display:block}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.body{font-size:15px}
.body p{margin:0 0 .6em} .body>:last-child{margin-bottom:0}
.body ol,.body ul{margin:.2em 0 .6em;padding-left:1.35em} .body li{margin:.3em 0}
.body h4{font-family:var(--serif);font-size:16px;margin:1em 0 .3em}
.body h4:first-child{margin-top:0}
.body h4 .en{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.body blockquote{margin:.4em 0 .7em;padding:6px 12px;border-left:3px solid var(--gold);background:var(--panel);border-radius:4px}
.body code{font-family:Consolas,ui-monospace,monospace;font-size:.9em;background:var(--panel-2);padding:0 4px;border-radius:4px}
.muted{color:var(--muted)}
.pending{display:none}
.shown{animation:fadein .45s ease-out both}
.msg.typing .body::after{content:"";display:block;width:30px;height:8px;margin-top:8px;opacity:.55;
  background:radial-gradient(circle,var(--muted) 2.5px,transparent 3px) 0 0/10px 8px repeat-x;animation:blink 1s infinite}
.msg.juror{align-self:center;max-width:min(560px,94%);border-top:3px solid var(--muted)}
.msg.juror.g{border-top-color:var(--pros)} .msg.juror.n{border-top-color:var(--ng)}
.vote{font-weight:700;font-size:12px;padding:1px 10px;border-radius:999px;color:#fff;background:var(--muted);margin-left:auto}
.vote.g{background:var(--pros)} .vote.n{background:var(--ng)}
.lens{font-size:12px;color:var(--muted);margin:-2px 0 8px}
.line{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:14px;margin:5px 0}
.line .k{color:var(--muted);font-size:12px;padding-top:2px}
.verdict{align-self:stretch;text-align:center;border-radius:16px;padding:22px 16px 20px;color:#fff;background:var(--muted);box-shadow:var(--shadow);animation:stampin .6s cubic-bezier(.2,.9,.3,1.3) both}
.verdict.g{background:#9c2a22} .verdict.n{background:#2e6e48}
.verdict .lead{font-size:13px;opacity:.85;letter-spacing:.1em}
.verdict .v{font-family:var(--serif);font-size:clamp(42px,7vw,66px);font-weight:800;letter-spacing:.1em;line-height:1.15;margin:4px 0}
.verdict .count{font-size:15px;opacity:.92}
.foot{margin-top:28px;font-size:12px;color:var(--muted);word-break:break-all}
.foot a{color:inherit}

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.15}}
@keyframes blinkeye{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-7%)}}
@keyframes legs{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes talk{50%{transform:translateY(.6px) scaleX(1.02)}}
@keyframes hop{30%{transform:translateY(-38%)}60%{transform:translateY(0)}78%{transform:translateY(-10%)}100%{transform:translateY(0)}}
@keyframes thinkfloat{50%{transform:translateY(-3px)}}
@keyframes bump{40%{transform:scale(1.4)}}
@keyframes stampin{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
@keyframes strike{0%{transform:rotate(12deg)}25%{transform:rotate(34deg)}40%{transform:rotate(-30deg)}55%{transform:rotate(16deg)}75%{transform:rotate(-30deg)}100%{transform:rotate(-22deg)}}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:16px}
  .stage{top:0;margin:0 -16px;border-radius:0 0 14px 14px;border-top:0;z-index:5}
  .scene{--h:250px;--s:31px}
  .plate{font-size:9px;margin-top:2px;padding:0 4px}
  .bubble{font-size:11.5px;padding:5px 8px}
  .score{left:6px;top:6px;padding:2px 8px}
  .score b{font-size:14px}
  .now{display:none}
  .controls{padding:8px 10px}
  .ask{padding:0 10px 8px}
  .ask-note{padding:0 12px 8px}
  .status{left:6px;top:32px;padding:2px 8px}
  .msg{max-width:94%;scroll-margin-top:calc(var(--stage-h,320px) + 12px)}
  .curtain{width:7%}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">COURT · AI 법정<span class="live" id="live"></span></div>
      <h1 id="case-title"></h1>
    </div>
    <ol class="phases" id="phases"></ol>
    <button class="newcase" id="b-new" hidden>＋ 새 사건</button>
  </header>

  <div class="layout">
    <section class="stage" id="stage" aria-label="법정">
      <div class="scene" id="scene">

<script>
(function(){

var JUROR = {

};
var HATS = ["#3b82f6","#10b981","#f59e0b","#8b5cf6","#ec4899","#14b8a6","#64748b","#6366f1","#84cc16","#0ea5e9","#a855f7","#e11d48"];
var VOTE_KO = {"GUILTY":"유죄","NOT GUILTY":"무죄","NO VOTE":"기권"};
var VOTE_CLS = {"GUILTY":"g","NOT GUILTY":"n","NO VOTE":""};
var SECTION_KO = {"charges that stuck":"인정된 혐의","what the defense got right":"변호인이 맞힌 점",
  "conditions for acquittal":"무죄 조건","the sentence":"선고"};
var PHASES = ["개정","모두진술","반박","평의","평결","선고"];
var ORANGE = "#D97757", INK = "#1a1410";

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>"); }
function md(text){
  var lines = String(text || "").replace(/\r/g,"").split("\n"), html = "", list = null, para = [];
  function flushP(){ if (para.length){ html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } }
  function closeL(){ if (list){ html += "</" + list + ">"; list = null; } }
  lines.forEach(function(raw){
    var l = raw.trim(), m;
    if (!l){ flushP(); closeL(); return; }
    if ((m = l.match(/^#{1,6}\s+(.*)$/))){
      flushP(); closeL();
      var h = m[1].replace(/\*\*/g,"").trim(), ko = SECTION_KO[h.toLowerCase()];
      html += "<h4>" + esc(ko || h) + (ko ? ' <span class="en">' + esc(h) + "</span>" : "") + "</h4>";
      return;
    }
    if ((m = l.match(/^(\d+)[.)]\s+(.*)$/))){
      flushP();
      if (list !== "ol"){ closeL(); html += '<ol start="' + m[1] + '">'; list = "ol"; }
      html += "<li>" + inline(m[2]) + "</li>"; return;
    }
    if ((m = l.match(/^[-*•]\s+(.*)$/))){
      flushP();
      if (list !== "ul"){ closeL(); html += "<ul>"; list = "ul"; }
      html += "<li>" + inline(m[1]) + "</li>"; return;
    }
    closeL(); para.push(l);
  });
  flushP(); closeL();
  return html;
}

/* ---------- pixel characters ---------- */
function px(x, y, w, h, c){ return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>'; }
function sprite(kind, hat, cls){
  var s = '<svg class="spr' + (cls ? " " + cls : "") + '" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">';
  s += '<g class="la">' + px(3,11,1,3,ORANGE) + px(10,11,1,3,ORANGE) + "</g>";
  s += '<g class="lb">' + px(5,11,1,3,ORANGE) + px(12,11,1,3,ORANGE) + "</g>";
  s += '<g class="torso">' + px(2,3,12,8,ORANGE) + px(0,6,2,2,ORANGE) + px(14,6,2,2,ORANGE);
  s += '<g class="eyes">' + px(5,5,1,2,INK) + px(10,5,1,2,INK) + "</g>";
  if (kind === "judge"){
    var w = "#f4f1ea", wd = "#d9d3c4";
    s += px(3,0,10,1,w) + px(2,1,12,2,w) + px(1,3,2,1,w) + px(13,3,2,1,w) + px(1,4,1,2,wd) + px(14,4,1,2,wd);
    s += px(2,9,12,2,"#2a2118");
  } else if (kind === "prosecution" || kind === "defense"){
    var t = kind === "prosecution" ? "#b3261e" : "#1f5fa8", td = kind === "prosecution" ? "#7d1a14" : "#153f72";
    s += px(7,7,2,1,td) + px(7,8,2,3,t);
  } else if (kind === "clerk"){
    s += px(3,1,10,2,"#2e7d4f") + px(1,2,3,1,"#2e7d4f");
    s += '<rect x="4" y="4.5" width="3" height="3" fill="none" stroke="' + INK + '" stroke-width=".5"/><rect x="9" y="4.5" width="3" height="3" fill="none" stroke="' + INK + '" stroke-width=".5"/>';
  } else if (kind === "juror"){
    s += px(4,1,8,2,hat) + px(2,2,12,1,hat);
  }
  return s + "</g></svg>";
}

/* ---------- static parts ---------- */
var caseLines = String(D.case || "").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
var caseTitle = D.empty ? "아직 열린 재판이 없어요" : (caseLines[0] || "(사건 기록 없음)").replace(/^#+\s*/,"");
$("#case-title").textContent = caseTitle;
$("#phases").innerHTML = PHASES.map(function(p){ return "<li>" + p + "</li>"; }).join("");
$("#foot").innerHTML = "전체 기록 폴더: " + esc(D.dir) + (D.seed != null ? " · 시드 " + esc(D.seed) : "") +
  '<br>Made with <a href="https://github.com/alexyc9381/court-skill">/court</a>, a free Claude Code skill by Alex Chen (@nocodealex).';

var scene = $("#scene");
var LECTERN = {x:50, y:61};
var chars = {};
function addChar(id, kind, home, z, hat, title){
  var el = document.createElement("div");
  el.className = "chr " + kind;
  el.style.zIndex = z;
  el.title = title || "";
  el.innerHTML = '<div class="sign"><b></b><i></i></div><div class="think">…</div>' + sprite(kind, hat);
  el.querySelector(".eyes").style.animationDelay = (-Math.random() * 4).toFixed(2) + "s";
  scene.appendChild(el);
  var c = {id:id, kind:kind, el:el, home:home, pos:null, hat:hat, wt:0};
  chars[id] = c;
  place(c, home, true);
  return c;
}
function place(c, pos, instant){
  c.pos = {x:pos.x, y:pos.y};
  if (instant){ c.el.style.transition = "none"; }
  c.el.style.setProperty("--x", pos.x); c.el.style.setProperty("--y", pos.y);
  if (instant){ void c.el.offsetWidth; c.el.style.transition = ""; }
}
function walk(c, pos){
  if (c.pos.x === pos.x && c.pos.y === pos.y) return 0;
  var ms = walkMs();
  clearTimeout(c.wt);
  c.el.classList.add("walking");
  place(c, pos, reduced);
  c.wt = setTimeout(function(){ c.el.classList.remove("walking"); }, ms);
  return ms;
}

addChar("judge", "judge", {x:50, y:31}, 10, null, "판사");
addChar("clerk", "clerk", {x:25, y:38}, 14, null, "서기");
addChar("prosecution", "prosecution", {x:15, y:60}, 30, null, "검사");
addChar("defense", "defense", {x:85, y:60}, 30, null, "변호인");

var nJ = D.jurors.length, cols = Math.min(nJ, 6), rows = Math.ceil(nJ / cols);
var rowY = rows === 1 ? [93] : [83, 97];
$("#jurybox").style.top = (rowY[0] - 15) + "%";
var jurors = D.jurors.map(function(j, i){
  var r = Math.floor(i / cols), c = i % cols, inRow = Math.min(cols, nJ - r * cols);
  var x = inRow === 1 ? 50 : 12 + (76 / (inRow - 1)) * c;
  var info = JUROR[j.juror] || [j.juror, ""];
  var ch = addChar("juror-" + i, "juror", {x:x, y:rowY[r]}, 40 + r * 2, HATS[i % HATS.length], "배심원 " + (i + 1) + " · " + info[0]);
  ch.info = info;
  return ch;
});

/* ---------- speech bubble ---------- */
var bubble = $("#bubble"), tail = $("#tail"), lastSay = null;
function say(c, text, tone){
  lastSay = text ? [c, text, tone] : null;
  if (!text){ bubble.classList.remove("on"); tail.classList.remove("on"); return; }
  text = text.replace(/\s+/g, " ").trim();
  var W = scene.clientWidth, max = W < 520 ? 44 : 84;
  bubble.textContent = text.length > max ? text.slice(0, max - 1) + "…" : text;
  bubble.className = "bubble on " + (tone || "");
  tail.className = "bubble-tail on " + (tone || "");
  var H = scene.clientHeight, S = c.el.offsetHeight;
  var x = c.pos.x / 100 * W, y = c.pos.y / 100 * H;
  var bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  var left = Math.max(6, Math.min(W - bw - 6, x - bw / 2));
  var top = y - S - bh - 16, below = top < 4;
  if (below) top = y + 10;
  bubble.style.left = left + "px"; bubble.style.top = top + "px";
  tail.classList.toggle("up", below);
  tail.style.left = Math.max(left + 10, Math.min(left + bw - 22, x - 6)) + "px";
  tail.style.top = (below ? top - 6 : top + bh - 7) + "px";
}

/* ---------- scenes ---------- */
function verdictParts(){
  var g = D.guilty, n = D.not_guilty;
  if (D.verdict === "GUILTY") return ["유죄", g + " 대 " + n, "g"];
  if (D.verdict === "NOT GUILTY") return ["무죄", n + " 대 " + g, "n"];
  return ["평결 불성립", "유죄 " + g + " · 무죄 " + n, "h"];
}
function build(){
  var S = [], complete = !D.live || D.finished;
  if (D.empty) return S;
  function judge(phase, tag, html, extra){
    var sc = {phase:phase, actor:"judge", side:"center judge", name:"판사", tag:tag, html:html};
    for (var k in extra) sc[k] = extra[k];
    S.push(sc);
  }
  S.push({phase:0, actor:"clerk", side:"center", name:"서기", tag:"개정",
    html:"<p>지금부터 재판을 시작합니다. 사건 기록을 읽겠습니다.</p><blockquote>" + md(D.case) + "</blockquote>"});
  judge(0, "공소", "<p>이 안건이 적힌 그대로는 실패하며, 이대로 진행해서는 안 된다는 혐의입니다.</p><p>검사, 발언대로 나와 모두진술을 하세요.</p>");
  for (var i = 0; i < D.statements.length; i++){
    var s = D.statements[i], pros = s.side === "prosecution";
    if (i === 2) judge(2, "반박", "<p>양측은 상대의 주장에 하나씩 답하세요. 검사부터 하세요.</p>", {pause:700});
    // Live: stop at the first statement not written yet, so scenes only ever get appended.
    if (!s.text && !complete) return S;
    S.push({phase: s.phase === "opening" ? 1 : 2, actor: s.side, walks:true, tone: pros ? "pros" : "def",
      side: pros ? "left" : "right", name: pros ? "검사" : "변호인", tag: s.phase === "opening" ? "모두진술" : "반박",
      html: s.text ? md(s.text) : '<p class="muted">(이 진술은 기록되지 않았어요)</p>'});
  }
  judge(3, "평의", "<p>배심원은 각자 평의하세요. 서로의 표는 볼 수 없습니다.</p>",
    {enter:function(){ jurors.forEach(function(j){ j.el.classList.add("thinking"); }); }, pause:1600});
  var g = 0, n = 0;
  for (var k = 0; k < D.jurors.length; k++){
    var j = D.jurors[k];
    if (!j.voted && !complete) return S;
    if (j.vote === "GUILTY") g++; else if (j.vote === "NOT GUILTY") n++;
    S.push(jurorScene(j, k, g, n));
  }
  var v = verdictParts();
  S.push({phase:4, actor:"judge", kind:"verdict", hold:2800, verdict:v,
    html:'<div class="lead">배심원 평결</div><div class="v">' + v[0] + '</div><div class="count">' + v[1] + "</div>",
    enter:function(instant){ verdictFx(v, instant); }, after:function(){ $("#stamp").classList.add("parked"); }});
  if (!D.judge && !complete) return S;
  judge(5, "선고", D.judge ? md(D.judge) : '<p class="muted">판사가 아직 판결문을 쓰지 않았어요.</p>');
  S.push({phase:5, actor:"clerk", side:"center", name:"서기", tag:"폐정",
    html:"<p>이것으로 재판을 마칩니다. 전체 기록은 아래 폴더에 있어요.</p><p class=\"path\"><code>" + esc(D.dir) + "</code></p>"});
  return S;
}
function jurorScene(j, i, gg, nn){
  var ch = jurors[i], cls = VOTE_CLS[j.vote] || "", rows = "";
  if (j.reason) rows += '<div class="line"><span class="k">이유</span><span>' + inline(j.reason) + "</span></div>";
  if (j.fact) rows += '<div class="line"><span class="k">결정적 사실</span><span>' + inline(j.fact) + "</span></div>";
  if (j.flip) rows += '<div class="line"><span class="k">뒤집힐 조건</span><span>' + inline(j.flip) + "</span></div>";
  if (!rows) rows = '<div class="line"><span class="k"></span><span class="muted">표를 남기지 않았어요</span></div>';
  return {phase:3, actor:"juror-" + i, juror:i, side:"center juror " + cls,
    name:"배심원 " + (i + 1) + " · " + ch.info[0], badge:'<span class="vote ' + cls + '">' + (VOTE_KO[j.vote] || j.vote) + "</span>",
    lens: ch.info[1], html: rows, pause:900,
    enter:function(instant){ raiseSign(ch, cls, VOTE_KO[j.vote] || "기권", instant); setScore(gg, nn, !instant); }};
}
var scenes = build();

/* ---------- stage effects ---------- */
function raiseSign(ch, cls, label, instant){
  ch.el.classList.remove("thinking");
  var sg = ch.el.querySelector(".sign");
  sg.className = "sign " + cls;
  sg.querySelector("b").textContent = label;
  void sg.offsetWidth;
  sg.classList.add("on");
  if (!instant){ ch.el.classList.remove("hop"); void ch.el.offsetWidth; ch.el.classList.add("hop"); }
}
function setScore(g, n, animate){
  [["#sg", g], ["#sn", n]].forEach(function(p){
    var el = $(p[0]);
    if (animate && el.textContent !== String(p[1])){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    el.textContent = p[1];
  });
}
function verdictFx(v, instant){
  var st = $("#stamp");
  st.className = "stamp " + v[2];
  st.querySelector("b").textContent = v[0];
  st.querySelector("span").textContent = v[1];
  var win = v[2] === "g" ? chars.prosecution : v[2] === "n" ? chars.defense : null;
  var lose = v[2] === "g" ? chars.defense : v[2] === "n" ? chars.prosecution : null;
  if (instant){
    st.classList.add("on", "parked");
    if (lose) lose.el.classList.add("slump");
    return;
  }
  var gv = $("#gavel");
  gv.classList.remove("strike"); scene.classList.remove("shake");
  void gv.offsetWidth;
  gv.classList.add("strike");
  later(function(){ scene.classList.add("shake"); }, 430);
  later(function(){ st.classList.add("on"); }, 500);
  later(function(){
    if (win){ win.el.classList.remove("cheer"); void win.el.offsetWidth; win.el.classList.add("cheer"); }
    if (lose) lose.el.classList.add("slump");
  }, 900);
}
function setPhase(p){
  [].forEach.call($("#phases").children, function(li, i){
    li.classList.toggle("on", i === p); li.classList.toggle("done", i < p);
  });
}
function spotlight(id){
  for (var k in chars) chars[k].el.classList.toggle("active", k === id);
}
function talking(id, on){
  for (var k in chars) chars[k].el.classList.remove("talking");
  if (on && chars[id]) chars[id].el.classList.add("talking");
}

/* ---------- transcript ---------- */
var log = $("#log");
function avatarFor(sc){
  var c = chars[sc.actor];
  return '<span class="av">' + sprite(c.kind, c.hat) + "</span>";
}
function sceneEl(sc){
  var el = document.createElement("article");
  if (sc.kind === "verdict"){
    el.className = "verdict " + sc.verdict[2];
    el.innerHTML = sc.html;
    return el;
  }
  el.className = "msg " + sc.side;
  el.innerHTML = "<header>" + avatarFor(sc) + "<b>" + esc(sc.name) + "</b>" +
    (sc.tag ? '<span class="tag">' + esc(sc.tag) + "</span>" : "") + (sc.badge || "") + "</header>" +
    (sc.lens ? '<div class="lens">' + esc(sc.lens) + "</div>" : "") +
    '<div class="body">' + sc.html + "</div>";
  return el;
}
function revealItems(el){
  return [].slice.call(el.querySelectorAll(".body > p, .body > h4, .body > blockquote > p, .body > blockquote li, .body > ol > li, .body > ul > li, .body > .line"));
}
function itemText(it){
  if (it.classList.contains("line")) return it.lastElementChild.textContent;
  var en = it.querySelector(".en");
  return en ? it.textContent.replace(en.textContent, "").trim() : it.textContent;
}
function nearBottom(){ return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 280; }
function follow(el, stick){ if (stick) el.scrollIntoView({block:"nearest", behavior: reduced ? "auto" : "smooth"}); }

/* ---------- player ---------- */
var reduced = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
var idx = 0, playing = false, speed = 1, timers = [], cur = null;
var SPEEDS = [1, 1.5, 2, 3], WALK = 1100;
function walkMs(){ return reduced ? 0 : WALK / speed; }
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function setSpeed(s){ speed = s; scene.style.setProperty("--walk", walkMs() + "ms"); sync(); }

function play(sc, manual){
  clearTimers();
  var stick = manual || idx === 1 || nearBottom();
  setPhase(sc.phase);
  spotlight(sc.actor);
  $("#now").innerHTML = "<b>" + esc(sc.kind === "verdict" ? "판사 · 평결 낭독" : sc.name + (sc.tag ? " · " + sc.tag : "")) + "</b>";
  say(null);
  var el = sceneEl(sc);
  log.appendChild(el);
  var items = revealItems(el);
  items.forEach(function(it){ it.classList.add("pending"); });
  if (items.length) el.classList.add("typing");
  var pre = sc.walks ? walk(chars[sc.actor], LECTERN) : 0;
  if (sc.enter) sc.enter(false);
  cur = {sc: sc, el: el, items: items, i: 0, held: false};
  follow(el, stick);
  later(function(){ if (cur && cur.sc === sc){ talking(sc.actor, items.length > 0); tick(); } }, pre + 300 / speed);
  waitingFx(); sync();
}
function tick(){
  var c = cur; if (!c) return;
  if (c.i >= c.items.length){
    if (c.sc.hold && !c.held){ c.held = true; later(tick, c.sc.hold / speed); return; }
    return done();
  }
  var stick = nearBottom();
  var it = c.items[c.i++];
  it.classList.remove("pending"); it.classList.add("shown");
  if (c.i >= c.items.length) c.el.classList.remove("typing");
  if (!it.classList.contains("path")) say(chars[c.sc.actor], itemText(it), c.sc.tone);
  follow(it, stick);
  var len = (it.textContent || "").length;
  later(tick, Math.min(9000, 420 + len * 26) / speed);
}
function finish(){
  var c = cur; if (!c) return;
  clearTimers();
  c.items.forEach(function(it){ it.classList.remove("pending"); it.classList.add("shown"); });
  c.el.classList.remove("typing");
  c.i = c.items.length; c.held = true;
  if (c.sc.kind === "verdict"){ $("#stamp").classList.add("on"); }
  done();
}
function done(){
  var c = cur; cur = null;
  talking(null, false);
  say(null);
  if (c){
    if (c.sc.walks) walk(chars[c.sc.actor], chars[c.sc.actor].home);
    if (c.sc.after) c.sc.after();
  }
  if (playing){
    if (idx < scenes.length) later(function(){ if (playing && !cur) step(); }, ((c && c.sc.pause) || 1100) / speed);
    else if (!waitingForMore()) setPlaying(false);
  }
  waitingFx(); sync();
}
function step(manual){
  if (cur){ finish(); return; }
  if (idx >= scenes.length) return;
  start();
  play(scenes[idx++], manual);
}
function start(){ var intro = $(".intro"); if (intro) intro.classList.add("started"); }
function setPlaying(on){
  playing = on;
  if (on && !cur && idx < scenes.length) step();
  sync();
}
function resetStage(){
  for (var k in chars){
    var c = chars[k];
    clearTimeout(c.wt);
    c.el.className = "chr " + c.kind;
    c.el.querySelector(".sign").className = "sign";
    place(c, c.home, true);
  }
  $("#stamp").className = "stamp";
  $("#gavel").classList.remove("strike"); scene.classList.remove("shake");
  say(null);
}
function restart(){
  clearTimers(); cur = null; idx = 0; playing = false;
  log.innerHTML = "";
  resetStage(); setScore(0, 0, false); setPhase(-1);
  $("#now").textContent = "개정을 기다리는 중이에요";
  intro(); sync();
}
function showAll(){
  playing = false;
  if (cur) finish();
  clearTimers();
  start();
  while (idx < scenes.length){
    var sc = scenes[idx++];
    setPhase(sc.phase);
    log.appendChild(sceneEl(sc));
    if (sc.enter) sc.enter(true);
    if (sc.after) sc.after();
  }
  for (var k in chars){ var c = chars[k]; clearTimeout(c.wt); c.el.classList.remove("walking","thinking","talking","active","hop","cheer"); place(c, c.home, true); }
  say(null);
  $("#now").innerHTML = "<b>재판 기록 전체</b>";
  sync();
}
function waitingForMore(){ return !!(D.live && !D.finished && !D.empty && !(D.runner && D.runner.status === "error")); }
function isOver(){ return idx >= scenes.length && !cur && !waitingForMore(); }
function sync(){
  var none = idx >= scenes.length && !cur;
  $("#b-play").textContent = playing ? "⏸ 멈춤" : (isOver() ? "↺ 다시 보기" : (idx === 0 ? "▶ 재판 시작" : "▶ 재생"));
  $("#b-next").disabled = none;
  $("#b-all").disabled = none;
  $("#b-speed").textContent = speed + "×";
}
function intro(){
  var el = document.createElement("div");
  el.className = "intro";
  if (D.empty){
    el.innerHTML = '<div class="cast">' + sprite("prosecution") + sprite("judge", null, "big") + sprite("defense") + "</div>" +
      '<h2>AI 법정</h2><p class="case">아직 열린 재판이 없어요</p>' +
      (D.ask ? '<p class="meta">판단받고 싶은 아이디어나 계획을 접수하면 바로 재판이 열려요.</p><button class="primary" id="b-intro-new">＋ 새 사건 접수</button>'
             : '<p class="meta">이 컴퓨터에서 claude 명령을 찾지 못해 여기서 재판을 열 수 없어요.</p>');
    log.appendChild(el);
    var nb = el.querySelector("#b-intro-new");
    if (nb) nb.addEventListener("click", openNew);
    return;
  }
  el.innerHTML = '<div class="cast">' + sprite("prosecution") + sprite("judge", null, "big") + sprite("defense") + "</div>" +
    '<h2>사건</h2><p class="case">' + esc(caseTitle) + "</p>" +
    '<p class="meta">배심원 ' + nJ + "명 · 검사와 변호인의 진술 4편 · 판결문 1편</p>" +
    '<button class="primary" id="b-intro">▶ 재판 시작</button>' +
    '<p class="hint">스페이스: 재생/멈춤 · →: 다음 · Home: 처음부터</p>';
  log.appendChild(el);
  el.querySelector("#b-intro").addEventListener("click", function(){ setPlaying(true); });
  renderPast();
}

$("#b-play").addEventListener("click", function(){
  if (playing){ setPlaying(false); return; }
  if (isOver()){ restart(); }
  setPlaying(true);
});
$("#b-next").addEventListener("click", function(){ step(true); });
$("#b-restart").addEventListener("click", restart);
$("#b-all").addEventListener("click", showAll);
$("#b-speed").addEventListener("click", function(){ setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]); });
document.addEventListener("keydown", function(e){
  var t = e.target && e.target.tagName;
  if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA") return;
  if (t === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " "){ e.preventDefault(); $("#b-play").click(); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); step(true); }
  else if (e.key === "Home"){ e.preventDefault(); restart(); }
});
function measure(){
  document.documentElement.style.setProperty("--stage-h", $("#stage").offsetHeight + "px");
  if (lastSay) say(lastSay[0], lastSay[1], lastSay[2]);
}
window.addEventListener("resize", measure);

/* ---------- live: follow the trial as files land ---------- */
var TOKEN = D.token, online = true, qEls = {}, reactT = 0;
var WAIT_KO = {opening:"검사와 변호인이 모두진술을 준비하고 있어요", rebuttal:"양측이 반박을 준비하고 있어요",
  jury:"배심원이 평의하고 있어요", judge:"판사가 판결문을 쓰고 있어요"};
function merge(){
  var next = build();
  for (var k = scenes.length; k < next.length; k++) scenes.push(next[k]);
  if (playing && !cur && idx < scenes.length) step();
  waitingFx(); sync();
}
function waitingFx(){
  var st = $("#status");
  for (var k in chars) chars[k].el.classList.remove("waiting");
  if (D.runner && D.runner.status === "error"){
    st.classList.add("on", "off");
    st.querySelector("span").textContent = "재판이 멈췄어요: " + D.runner.message;
    return;
  }
  if (!waitingForMore()){ st.classList.remove("on"); return; }
  st.classList.add("on");
  st.classList.toggle("off", !online);
  st.querySelector("span").textContent = online ? (WAIT_KO[D.phase] || "재판 진행 중") + "…" : "서버와 연결이 끊겼어요";
  if (cur || idx < scenes.length) return;
  if (D.phase === "opening" || D.phase === "rebuttal"){ chars.prosecution.el.classList.add("waiting"); chars.defense.el.classList.add("waiting"); }
  else if (D.phase === "judge") chars.judge.el.classList.add("waiting");
  if (idx > 0) $("#now").innerHTML = "<b>" + esc(WAIT_KO[D.phase] || "다음 순서를 기다리는 중") + "…</b>";
}
function liveBadge(){
  var el = $("#live");
  if (D.empty){ el.textContent = ""; return; }
  if (!D.live){ el.textContent = ""; return; }
  el.textContent = D.finished ? (D.ask ? "● 재판 종료 · 질문 받는 중" : "● 재판 종료") : "● LIVE";
  el.classList.toggle("done", !!D.finished);
}
function poll(){
  fetch("api/state", {cache:"no-store"}).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(nd){
      if (nd.dir !== D.dir){ location.reload(); return; }
      online = true;
      D = nd;
      merge(); questions(); liveBadge();
    })
    .catch(function(){ online = false; waitingFx(); })
    .then(function(){ setTimeout(poll, 1500); });
}

/* ---------- questions ---------- */
function whoName(w){
  if (w.indexOf("juror-") === 0){ var i = +w.split("-")[1]; return "배심원 " + (i + 1) + " · " + (jurors[i] ? jurors[i].info[0] : ""); }
  return {judge:"판사", prosecution:"검사", defense:"변호인", clerk:"서기"}[w] || w;
}
function addQA(q, fresh, parent){
  var box = parent || log, c = chars[q.who] || chars.clerk;
  var u = document.createElement("article");
  u.className = "msg user";
  u.innerHTML = '<header><b>나</b><span class="tag">' + esc(whoName(q.who)) + "에게 질문</span></header>" +
    '<div class="body"><p>' + inline(q.q) + "</p></div>";
  var a = document.createElement("article");
  a.className = "msg center answer typing";
  a.innerHTML = '<header><span class="av">' + sprite(c.kind, c.hat) + "</span><b>" + esc(whoName(q.who)) +
    '</b><span class="tag">답변</span></header><div class="body"></div>';
  box.appendChild(u); box.appendChild(a);
  var e = {q:q, a:a, fresh:fresh, filled:false};
  qEls[q.id] = e;
  if (q.status !== "pending") fill(e, q);
  if (fresh) follow(a, true);
  return e;
}
function fill(e, q){
  e.filled = true;
  e.a.classList.remove("typing");
  e.a.classList.toggle("err", q.status === "error");
  e.a.querySelector(".body").innerHTML = md(q.answer) || '<p class="muted">(빈 답변)</p>';
}
function renderPast(){
  qEls = {};
  var qs = D.questions || [];
  if (!qs.length) return;
  var d = document.createElement("details");
  d.className = "past";
  d.innerHTML = "<summary>이전에 한 질문 " + qs.length + "개</summary>";
  var box = document.createElement("div");
  box.className = "qa";
  d.appendChild(box);
  log.appendChild(d);
  qs.forEach(function(q){ addQA(q, false, box); });
}
function questions(){
  (D.questions || []).forEach(function(q){
    var e = qEls[q.id] || addQA(q, true);
    if (q.status !== "pending" && !e.filled){
      fill(e, q);
      if (e.fresh){ follow(e.a, true); react(q); $("#ask-note").textContent = ""; measure(); }
    }
  });
}
function react(q){
  var c = chars[q.who];
  if (cur || !c || q.status !== "done") return;
  clearTimeout(reactT);
  spotlight(q.who); talking(q.who, true);
  if (c.kind === "juror"){ c.el.classList.remove("hop"); void c.el.offsetWidth; c.el.classList.add("hop"); }
  say(c, q.answer.replace(/[#*`>_]/g, ""), q.who === "prosecution" ? "pros" : q.who === "defense" ? "def" : "");
  reactT = setTimeout(function(){ if (!cur){ talking(null, false); say(null); spotlight(null); } }, 7000);
}
function setupAsk(){
  var form = $("#ask"), note = $("#ask-note");
  if (!D.live){
    $("#foot").insertAdjacentHTML("beforeend", "<br>법정에 질문하려면 <code>python3 court.py serve</code>로 이 재판을 열어 주세요.");
    return;
  }
  if (D.empty) return;
  if (!D.ask){ note.textContent = "이 컴퓨터에서 claude 명령을 찾지 못해 질문은 꺼져 있어요."; return; }
  var opts = [["judge","판사"],["prosecution","검사"],["defense","변호인"],["clerk","서기"]].concat(
    jurors.map(function(c, i){ return ["juror-" + i, "배심원 " + (i + 1) + " · " + c.info[0]]; }));
  $("#ask-who").innerHTML = opts.map(function(o){ return '<option value="' + o[0] + '">' + esc(o[1]) + "</option>"; }).join("");
  form.classList.add("on");
  note.textContent = D.login === false
    ? "질문에 답하려면 이 컴퓨터의 claude 명령이 로그인되어 있어야 해요. 터미널에서 claude auth login을 한 번 실행해 주세요."
    : "질문 하나에 claude 호출이 한 번 들어요. 답은 이 재판 기록만 보고 해요.";
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var input = $("#ask-q"), text = input.value.trim(), who = $("#ask-who").value, btn = $("#ask-go");
    if (!text) return;
    btn.disabled = true;
    fetch("api/ask", {method:"POST", headers:{"Content-Type":"application/json", "X-Court-Token":TOKEN},
      body: JSON.stringify({who:who, q:text})})
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || "질문을 보내지 못했어요"); return j; }); })
      .then(function(j){
        input.value = "";
        note.textContent = "답을 기다리는 중이에요. 보통 10~30초쯤 걸려요.";
        if (!qEls[j.id]) addQA({id:j.id, who:who, q:text, status:"pending", answer:""}, true);
      })
      .catch(function(err){ note.textContent = err.message || "질문을 보내지 못했어요"; })
      .then(function(){ btn.disabled = false; measure(); });
  });
}

/* ---------- new case from the page ---------- */
function openNew(){
  var dlg = $("#newcase");
  $("#nc-err").textContent = D.login === false
    ? "재판을 열려면 이 컴퓨터의 claude 명령이 로그인되어 있어야 해요. 터미널에서 claude auth login을 한 번 실행해 주세요." : "";
  if (dlg.showModal){ if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
  $("#nc-case").focus();
}
function setupNew(){
  if (!D.live || !D.ask) return;
  var b = $("#b-new");
  b.hidden = false;
  b.addEventListener("click", openNew);
  $("#nc-cancel").addEventListener("click", function(){ var d = $("#newcase"); if (d.close) d.close(); else d.removeAttribute("open"); });
  $("#nc-form").addEventListener("submit", function(e){
    e.preventDefault();
    var go = $("#nc-go"), err = $("#nc-err");
    go.disabled = true; err.textContent = "";
    fetch("api/trial", {method:"POST", headers:{"Content-Type":"application/json", "X-Court-Token":TOKEN},
      body: JSON.stringify({"case": $("#nc-case").value, jury: +$("#nc-jury").value, seed: $("#nc-seed").value})})
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || "재판을 열지 못했어요"); return j; }); })
      .then(function(){ location.href = "./?play=1"; })
      .catch(function(x){ err.textContent = x.message; go.disabled = false; });
  });
}

intro(); setPhase(-1); setSpeed(1); setupAsk(); setupNew(); liveBadge(); waitingFx(); measure();
if (/[?&]play=1/.test(location.search)){
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  if (!D.empty) setPlaying(true);
}
if (D.empty && D.live && D.ask) openNew();
if (D.live) setTimeout(poll, 1500);
})();
</script>
</body>
